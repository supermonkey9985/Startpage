<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  :root {
    --ink: #e9ecf5;
    --ink-soft: rgba(233, 236, 245, 0.62);
    --bg: #0b0e18;
    --glass: rgba(24, 29, 48, 0.62);
    --glass-hover: rgba(36, 43, 70, 0.85);
    --edge: rgba(233, 236, 245, 0.10);
    --teal: #2a9fb0;
    --violet: #6c5ce7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: grid;
    place-items: center;
  }
  /* Keeps text readable when you use a photo as background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(8, 11, 20, var(--shade, 0));
    pointer-events: none;
    z-index: 1;
  }
  main {
    position: relative;
    z-index: 2;
    width: min(680px, 92vw);
    text-align: center;
    padding: 4vh 0;
    animation: rise 1s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Slowly drifting colour glows behind everything */
  .aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .aurora[hidden] { display: none; }
  .aurora span { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
  .aurora .a { width: 55vw; height: 55vw; left: -12vw; top: -18vw; background: rgba(108, 92, 231, 0.38); animation: driftA 28s ease-in-out infinite alternate; }
  .aurora .b { width: 50vw; height: 50vw; right: -14vw; bottom: -20vw; background: rgba(42, 159, 176, 0.34); animation: driftB 34s ease-in-out infinite alternate; }
  .aurora .c { width: 32vw; height: 32vw; left: 38vw; top: 30vh; background: rgba(70, 110, 220, 0.20); animation: driftC 40s ease-in-out infinite alternate; }
  @keyframes driftA { to { transform: translate(28vw, 22vh) scale(1.2); } }
  @keyframes driftB { to { transform: translate(-30vw, -20vh) scale(1.15); } }
  @keyframes driftC { to { transform: translate(-22vw, 18vh) scale(0.8); } }
  .colon { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #clock {
    font-size: clamp(4.5rem, 16vw, 9rem);
    font-weight: 200;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  #greeting { margin: 0.6rem 0 0; font-size: 1.2rem; color: var(--ink-soft); }
  #date { margin: 0.2rem 0 0; font-size: 0.95rem; color: var(--ink-soft); }
  form { margin: 2.6rem auto 0; max-width: 480px; }
  input[type="search"] {
    width: 100%;
    padding: 0.9rem 1.3rem 0.9rem 3.7rem;
    font: inherit;
    color: var(--ink);
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    outline: none;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  input[type="search"]::placeholder { color: var(--ink-soft); }
  input[type="search"]:focus {
    background: var(--glass-hover);
    border-color: var(--teal);
    box-shadow: 0 0 0 1px var(--teal);
  }
  .field { position: relative; }
  #engineBtn {
    position: absolute;
    left: 0.45rem;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 2.2rem;
    height: 2.2rem;
    padding: 0;
    display: grid;
    place-items: center;
    background: rgba(233, 236, 245, 0.92);
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  #engineBtn:hover, #engineBtn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--teal); }
  #engineBtn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  #engineBtn img { width: 1.2rem; height: 1.2rem; display: block; }
  #engineMenu {
    position: absolute;
    z-index: 5;
    top: calc(100% + 0.5rem);
    left: 0;
    min-width: 12rem;
    margin: 0;
    padding: 0.35rem;
    list-style: none;
    text-align: left;
    background: rgba(18, 22, 38, 0.96);
    border: 1px solid var(--edge);
    border-radius: 1rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  #engineMenu[hidden] { display: none; }
  #engineMenu button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.5rem 0.7rem;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 0.7rem;
    cursor: pointer;
  }
  #engineMenu button:hover, #engineMenu button:focus-visible { background: var(--glass-hover); outline: none; }
  #engineMenu button[aria-current="true"] { box-shadow: inset 0 0 0 1px var(--teal); }
  #engineMenu img { width: 1.2rem; height: 1.2rem; border-radius: 4px; background: rgba(233,236,245,0.92); padding: 2px; }
  #links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.7rem;
    margin: 2.2rem 0 0;
    padding: 0;
    list-style: none;
  }
  #links a {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 1.1rem 0.55rem 0.6rem;
    color: var(--ink);
    text-decoration: none;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  #links a:hover { background: var(--glass-hover); border-color: var(--teal); transform: translateY(-2px); }
  #links a:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .icon {
    width: 1.8rem;
    height: 1.8rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: rgba(233, 236, 245, 0.92);
    font-size: 0.8rem;
    font-weight: 600;
    color: #12162a;
  }
  .icon img { width: 1.15rem; height: 1.15rem; display: block; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>
<main>
  <h1 id="clock">00:00</h1>
  <p id="greeting"></p>
  <p id="date"></p>

  <form id="search" action="https://search.brave.com/search" method="get">
    <div class="field">
      <button type="button" id="engineBtn" aria-haspopup="true" aria-expanded="false" title="Change search engine" aria-label="Change search engine"><img id="engineIcon" alt=""></button>
      <input type="search" name="q" id="q" placeholder="Search the web" autocomplete="off" autofocus aria-label="Search">
      <ul id="engineMenu" hidden></ul>
    </div>
  </form>

  <ul id="links"></ul>
</main>

<script>
  /* ---------- EDIT THIS SECTION ---------- */
  const NAME = "";             // e.g. "Alex" — leave empty for no name
  const USE_24_HOUR = true;    // false for 12-hour clock
  const BACKGROUND_IMAGE = ""; // image URL or local path, e.g. "file:///C:/Users/you/Pictures/wall.jpg"
  const SHADE = 0.35;          // how much to darken a background image (0 to 1)
  const SHORTCUTS = [
    { name: "YouTube",   url: "https://www.youtube.com" },
    { name: "GitHub",    url: "https://github.com" },
    { name: "Gmail",     url: "https://mail.google.com" },
    { name: "Messenger", url: "https://www.messenger.com" },
    { name: "Discord",   url: "https://discord.com/app" },
    { name: "Claude",    url: "https://claude.ai" }
  ];
  /* --------------------------------------- */

  if (BACKGROUND_IMAGE) {
    document.body.style.backgroundImage = 'url("' + BACKGROUND_IMAGE + '")';
    document.body.style.setProperty("--shade", SHADE);
    document.querySelector(".aurora").hidden = true;
  }

  const links = document.getElementById("links");
  SHORTCUTS.forEach(function (s) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = s.url;

    const icon = document.createElement("span");
    icon.className = "icon";
    const host = new URL(s.url).hostname;
    const img = document.createElement("img");
    img.alt = "";
    img.src = "https://www.google.com/s2/favicons?domain=" + host + "&sz=64";
    // If the icon can't load (offline, blocked), fall back to the first letter
    img.onerror = function () { icon.textContent = s.name.charAt(0).toUpperCase(); };
    icon.appendChild(img);

    a.appendChild(icon);
    a.appendChild(document.createTextNode(s.name));
    li.appendChild(a);
    links.appendChild(li);
  });

  const clock = document.getElementById("clock");
  const greeting = document.getElementById("greeting");
  const dateEl = document.getElementById("date");

  function tick() {
    const now = new Date();
    clock.innerHTML = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: !USE_24_HOUR }).replace(":", '<span class="colon">:</span>');
    const h = now.getHours();
    const part = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    greeting.textContent = NAME ? part + ", " + NAME : part;
    dateEl.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Search engine switcher ---------- */
  const ENGINES = [
    { id: "brave",     name: "Brave Search", domain: "search.brave.com", url: "https://search.brave.com/search?q=" },
    { id: "google",    name: "Google",       domain: "google.com",       url: "https://www.google.com/search?q=" },
    { id: "bing",      name: "Bing",         domain: "bing.com",         url: "https://www.bing.com/search?q=" },
    { id: "startpage", name: "Startpage",    domain: "startpage.com",    url: "https://www.startpage.com/sp/search?query=" }
  ];
  const favicon = function (d) { return "https://www.google.com/s2/favicons?domain=" + d + "&sz=64"; };

  let engine = ENGINES[0];
  try {
    const saved = localStorage.getItem("engine");
    engine = ENGINES.find(function (e) { return e.id === saved; }) || ENGINES[0];
  } catch (err) {}

  const form = document.getElementById("search");
  const input = document.getElementById("q");
  const btn = document.getElementById("engineBtn");
  const menu = document.getElementById("engineMenu");
  const engineIcon = document.getElementById("engineIcon");

  function applyEngine() {
    engineIcon.src = favicon(engine.domain);
    input.placeholder = "Search with " + engine.name;
    btn.title = "Search engine: " + engine.name;
    Array.prototype.forEach.call(menu.querySelectorAll("button"), function (b) {
      if (b.dataset.id === engine.id) b.setAttribute("aria-current", "true");
      else b.removeAttribute("aria-current");
    });
  }
  function closeMenu() { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }

  ENGINES.forEach(function (e) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.id = e.id;
    const img = document.createElement("img");
    img.alt = "";
    img.src = favicon(e.domain);
    b.appendChild(img);
    b.appendChild(document.createTextNode(e.name));
    b.addEventListener("click", function () {
      engine = e;
      try { localStorage.setItem("engine", e.id); } catch (err) {}
      applyEngine();
      closeMenu();
      input.focus();
    });
    li.appendChild(b);
    menu.appendChild(li);
  });

  btn.addEventListener("click", function () {
    const open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", function (ev) {
    if (!form.contains(ev.target)) closeMenu();
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeMenu(); });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    const q = input.value.trim();
    if (q) window.location.href = engine.url + encodeURIComponent(q);
  });
  applyEngine();

</script>
</body>
</html>
